[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "supa-agent"
version = "0.1.0"
description = "Zero-dependency coding agent CLI"
requires-python = ">=3.8"
dependencies = ["prompt_toolkit>=3.0"]

[project.scripts]
supa = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["harness"]
